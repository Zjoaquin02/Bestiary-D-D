<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detalles y relatos antiguos sobre las criaturas del Bestiario Arcano.">
    <title>Crónicas del Bestiario</title>
    <link rel="icon" type="image/png" href="css/img/icon/Fogata.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,700;1,400&family=MedievalSharp&family=Caveat:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="entry">

    <nav class="nav-links">
        <a href="index.html" class="back-link" data-i18n="backLink">← Volver al Bestiario</a>
    </nav>

    <main class="book-open">
        <div class="page page-left">
            <!-- La ilustración se movió al content-wrapper para mejor soporte móvil -->
        </div>

        <div class="page page-right">
            <article class="content-wrapper">
                <header class="meta-header" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px;">
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <div class="danger-level" id="danger-level"></div>
                        <div class="habitat-badge" id="habitat-badge"></div>
                    </div>
                    
                    <!-- Botón de idioma integrado dentro de la hoja -->
                    <div class="lang-switcher" id="lang-switcher" style="position: relative; margin-left: 10px; z-index: 100;">
                        <button class="lang-btn" id="lang-btn" onclick="toggleLangDropdown()">
                            <img class="lang-flag" id="lang-flag" src="https://flagcdn.com/20x15/ar.png" alt="Argentina" width="20" height="15">
                            <span class="lang-code" id="lang-code">ES</span>
                            <span class="lang-arrow">&#9660;</span>
                        </button>
                        <div class="lang-dropdown" id="lang-dropdown" style="right: 0; left: auto; text-align: left;">
                            <button class="lang-option" id="lang-opt-es" onclick="setLanguage('es')">
                                <img src="https://flagcdn.com/20x15/ar.png" alt="Argentina" width="20" height="15"> Español
                            </button>
                            <button class="lang-option" id="lang-opt-en" onclick="setLanguage('en')">
                                <img src="https://flagcdn.com/20x15/us.png" alt="USA" width="20" height="15"> English
                            </button>
                        </div>
                    </div>
                </header>
                
                <nav id="variant-tabs" class="variant-tabs" style="display:none;"></nav>

                <h2 class="name" id="name"></h2>
                <div class="type-container">
                    <span class="categoria-badge" id="categoria"></span>
                    <span class="type" id="type"></span>
                </div>

                <div class="ornament">✺</div>

                <figure class="illustration-container">
                    <img id="img" class="monster-img">
                    <figcaption class="caption" data-i18n="captionText">Ilustración a mano de la criatura</figcaption>
                    <!-- Novedad: Sello del Vacío -->
                    <div id="cursed-seal" class="seal-hidden"></div>

                    <!-- Anotaciones del Jugador -->
                    <section id="annotations-box" class="annotations-box">
                        <h3 data-i18n="annotationsTitle">Anotaciones del Jugador</h3>
                        <textarea id="notes-area" data-i18n-placeholder="annotationsPlaceholder" placeholder="Escribe tus hallazgos aquí..."></textarea>
                    </section>
                </figure>

                <section class="resistances-section" id="resistances-section">
                    <div class="resist-item debil"><b data-i18n="vulnerableLabel">Vulnerable:</b> <span id="vulnerable"></span></div>
                    <div class="resist-item resistente"><b data-i18n="resistenteLabel">Resistente:</b> <span id="resistente"></span></div>
                </section>

                <section class="stat-box">
                    <p><b data-i18n="acLabel">Clase de Armadura:</b> <span id="ac"></span></p>
                    <p><b data-i18n="hpLabel">Puntos de Vida:</b> <span id="hp"></span></p>
                    <p><b data-i18n="speedLabel">Velocidad:</b> <span id="speed"></span></p>

                    <div class="stats-grid">
                        <div class="stat-item"><span class="label">STR</span> <b id="str"></b></div>
                        <div class="stat-item"><span class="label">DEX</span> <b id="dex"></b></div>
                        <div class="stat-item"><span class="label">CON</span> <b id="con"></b></div>
                        <div class="stat-item"><span class="label">INT</span> <b id="int"></b></div>
                        <div class="stat-item"><span class="label">WIS</span> <b id="wis"></b></div>
                        <div class="stat-item"><span class="label">CHA</span> <b id="cha"></b></div>
                    </div>
                </section>

                <!-- Nuevo Campo de Habilidad -->
                <section id="skill-section" class="skill-box" style="display:none;">
                    <h3 id="skill-title"></h3>
                    <p id="skill-text"></p>
                </section>

                <!-- Nueva Nota de Lore -->
                <section class="lore-box">
                    <h3 data-i18n="loreTitle">Crónicas y Relatos</h3>
                    <p id="lore"></p>
                </section>

                <!-- Nueva Nota de Supervivencia -->
                <section id="survival-box" class="survival-note" style="display:none;">
                    <h4 data-i18n="combatTitle">⚜ Guía de Combate ⚜</h4>
                    <p id="survival-text"></p>
                </section>

                <footer class="footer-nav" style="display: flex; flex-direction: column; align-items: center; gap: 15px;">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <button id="prev-btn" onclick="" class="filter-btn" style="display: none; padding: 10px 15px;" title="Hoja Anterior">◄</button>
                        <button onclick="location.href='index.html'" class="filter-btn" data-i18n="backBtn">« Regresar al Bestiario</button>
                        <button id="next-btn" onclick="" class="filter-btn" style="display: none; padding: 10px 15px;" title="Hoja Siguiente">►</button>
                    </div>
                    <div class="watermark">@Zapata.Joaquín</div>
                </footer>
            </article>
        </div>
    </main>

    <script src="js/app.js?v=2"></script>
</body>

</html>
