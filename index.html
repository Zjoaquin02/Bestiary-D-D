<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Un antiguo Bestiario Arcano con criaturas de mil años.">
    <title>El Bestiario Arcano</title>
    <link rel="icon" type="image/png" href="css/img/icon/Fogata.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,700;1,400&family=MedievalSharp&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="book-cover">
        <main class="book-content">
            <header>
                <h1 id="main-title">Bestiario Arcano</h1>
                <p class="subtitle">Crónicas de Criaturas Olvidadas</p>
                <nav class="filter-nav">
                    <button class="filter-btn active" id="btn-monsters" onclick="filterType('monster')">Criaturas</button>
                    <button class="filter-btn" id="btn-bosses" onclick="filterType('boss')">Jefes</button>
                </nav>
            </header>
            <div class="layout-nav">
                <button id="btn-col-toggle" onclick="toggleLayout()">3 Columnas</button>
            </div>
            <div class="grid" id="grid"></div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
